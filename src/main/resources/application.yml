spring:
  profiles:
    active: local
  datasource:
    # H2 文件模式：数据随应用启停持久化（db 文件生成在项目根 data/ 目录，已加入 .gitignore）
    url: jdbc:h2:file:./data/smartdesk
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    # 必须显式关闭 ddl-auto：H2 属于嵌入式库，Spring Boot 默认 create-drop 会在停机时删表
    hibernate:
      ddl-auto: none
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  data:
    redis:
      host: localhost
      port: 6380
      # timeout: 2000
  ai:
    openai:
      api-key: ${deepseek.api-key}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.3
      embedding:
        base-url: https://api.siliconflow.cn
        api-key: ${siliconflow.api-key}
        options:
          model: BAAI/bge-m3

    vectorstore:
      milvus:
        collection-name: knowledge_base
        embedding-dimension: 1024
        initialize-schema: true
        client:
          host: localhost
          port: 19530

server:
  port: 8080

logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.web.client: DEBUG
    org.apache.hc: DEBUG

app:
  rerank:
    base-url: https://api.siliconflow.cn
    api-key: ${siliconflow.api-key}
    model: BAAI/bge-reranker-v2-m3